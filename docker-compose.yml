version: '3.8'
services:
  db:
    image: postgres:15
    container_name: retro_store_db
    environment:
      POSTGRES_USER: retro_user
      POSTGRES_PASSWORD: retro_password
      POSTGRES_DB: retro_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: